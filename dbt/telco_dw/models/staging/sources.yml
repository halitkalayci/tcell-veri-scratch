version: 2

sources:
  - name: raw
    schema: raw
    description: "Bronze katmanı — kaynak sistemlerden geldiği gibi, kirli. Buraya dbt yazmaz, sadece okur."
    tables:
      - name: cdr_events
        description: "Çağrı/SMS/data olay kayıtları. event_id tekil DEĞİL (~%2 duplicate), msisdn formatı karışık, event_type casing varyantlı, ingested_at event_ts'ten 0-72 saat sonra."
        loaded_at_field: ingested_at
        freshness:
          warn_after: {count: 24, period: hour}
          error_after: {count: 72, period: hour}
      - name: subscribers
        description: "Abone kayıtları. Aynı msisdn birden fazla satırda olabilir (eski CHURNED + yeni ACTIVE). Güncel = max activation_date, eşitlikte max subscriber_id."
      - name: recharges
        description: "Yüklemeler (TRY)."
      - name: plans
        description: "Tarife tanımları."
      - name: plan_changes
        description: "Abonenin tarife değişiklik geçmişi."
      - name: campaigns
      - name: campaign_responses
      - name: corporate_accounts
        description: "Kurumsal hesap hiyerarşisi (parent_account_id). Recursive CTE demosu için."